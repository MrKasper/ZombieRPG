<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧟 Zombie MMO</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  /* Быстрые стили для новых элементов */
  .survival-bars { display: flex; gap: 10px; margin-top: 5px; font-size: 12px; }
  .survival-bar { display: flex; align-items: center; gap: 4px; }
  .survival-bar .bar { width: 50px; height: 8px; }
  .bar-food > div { background: #d6a23d; }
  .bar-water > div { background: #4d8ce0; }
  .bar-temp > div { background: #e05858; }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <h1>🧟 Zombie MMO</h1>
    <div class="auth-tabs">
      <button data-tab="login" class="active">Вход</button>
      <button data-tab="register">Регистрация</button>
    </div>
    <form id="login-form">
      <input name="username" placeholder="Логин" required>
      <input name="password" type="password" placeholder="Пароль" required>
      <button type="submit" class="btn-primary">Войти</button>
    </form>
    <form id="register-form" hidden>
      <input name="username" placeholder="Логин" required>
      <input name="password" type="password" placeholder="Пароль" required>
      <input name="name" placeholder="Имя" required>
      <button type="submit" class="btn-primary">Создать</button>
    </form>
    <div id="auth-error" class="error"></div>
  </div>
</div>

<div id="game-screen" hidden>
  <header id="top-bar">
    <div class="top-left">
      <span id="char-name" class="char-name"></span>
      <span id="char-title" class="badge" style="background: transparent; border-color: #555;"></span>
      <span id="char-level" class="badge"></span>
      <span id="char-stat-points" class="badge badge-warn" hidden></span>
    </div>
    <div class="top-right">
      <span title="Атака">⚔ <b id="char-attack">-</b></span>
      <span title="Защита">🛡 <b id="char-defense">-</b></span>
      <span title="Золото">💰 <b id="char-gold">-</b></span>
      <button id="factions-btn" class="btn-ghost" title="Фракции">🛡️</button>
      <button id="achievements-btn" class="btn-ghost" title="Достижения">🏆</button>
      <button id="auction-btn" class="btn-ghost" title="Аукцион">🔨</button>
      <button id="pvp-btn" class="btn-ghost" title="PvP">⚔️</button>
      <button id="sound-btn" class="btn-ghost" title="Звук">🔊</button>
      <button id="logout-btn" class="btn-ghost">Выйти</button>
    </div>
  </header>

  <div id="event-bar" hidden></div>

  <main id="main-grid">
    <div class="col">
      <!-- Экипировка (сокращено для примера) -->
      <section class="panel" id="equip-panel">
        <h2>🛡️ Экипировка</h2>
        <div class="equip-grid" id="equip-grid"></div>
      </section>

      <section class="panel" id="char-panel">
        <h2>Персонаж</h2>
        <div class="bar-row"><div class="bar-label">HP</div><div class="bar bar-hp"><div id="hp-bar"></div></div><div class="bar-text" id="hp-text"></div></div>
        <div class="bar-row"><div class="bar-label">MP</div><div class="bar bar-mp"><div id="mp-bar"></div></div><div class="bar-text" id="mp-text"></div></div>
        <div class="bar-row"><div class="bar-label">XP</div><div class="bar bar-xp"><div id="xp-bar"></div></div><div class="bar-text" id="xp-text"></div></div>

        <div class="survival-bars">
          <div class="survival-bar"><span>🍗</span><div class="bar bar-food"><div id="hunger-bar"></div></div></div>
          <div class="survival-bar"><span>💧</span><div class="bar bar-water"><div id="thirst-bar"></div></div></div>
          <div class="survival-bar"><span>🌡️</span><b id="temp-text">36.6°</b></div>
        </div>
      </section>
    </div>

    <section class="panel" id="loc-panel">
      <div class="loc-head"><h2 id="loc-name">—</h2></div>
      <canvas id="minimap-canvas" width="640" height="200"></canvas>
      <p id="loc-desc" class="loc-desc"></p>
      <canvas id="game-canvas" width="720" height="528"></canvas>
    </section>

    <div class="col">
      <section class="panel" id="inv-panel">
        <h2>🎒 Инвентарь</h2>
        <ul id="inv-list" class="inv-list"></ul>
      </section>

      <section class="panel" id="quest-tracker-panel">
        <h2>📜 Активные квесты</h2>
        <ul id="active-quests-list" class="list" style="font-size: 12px;"></ul>
      </section>

      <section class="panel" id="chat-panel">
        <div class="chat-tabs">
          <button data-tab="location" class="active">📍 Локация</button>
          <button data-tab="global">🌍 Глобал</button>
        </div>
        <div id="chat-messages"></div>
        <form id="chat-form" class="row">
          <input id="chat-input" placeholder="Сказать что-нибудь..." maxlength="300">
          <button type="submit">→</button>
        </form>
      </section>
    </div>
  </main>
</div>

<!-- Модалки -->
<div id="combat-modal" hidden><div class="combat-box">... (бой) ...</div></div>
<div id="factions-modal" class="modal" hidden>
  <div class="modal-box">
    <h2>🛡️ Фракции</h2>
    <div id="factions-list"></div>
    <button onclick="closeModal('factions-modal')" style="margin-top:12px">Закрыть</button>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<!-- СКРИПТЫ -->
<script src="{{ url_for('static', filename='js/core.js') }}"></script>
<script src="{{ url_for('static', filename='js/render.js') }}"></script>
<script src="{{ url_for('static', filename='js/canvas.js') }}"></script>
<script src="{{ url_for('static', filename='js/actions.js') }}"></script>
<script src="{{ url_for('static', filename='js/pvp.js') }}"></script>
<script src="{{ url_for('static', filename='js/modals.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
<script src="{{ url_for('static', filename='js/boot.js') }}"></script>
</body>
</html>
